# ---------------------------------------------------------------------
# Database
# Cloud: the hosting platform sets DB_URL, DB_USER and DB_PASSWORD.
# Local laptop: config/application.properties (not uploaded) holds the
# local MySQL login and overrides these values.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitjanta?createDatabaseIfNotExist=true}

spring.datasource.username=${DB_USER:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

# Small connection pool (cloud free tiers allow few connections)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------------------------------------------------------------------
# Web server
# ---------------------------------------------------------------------
# Cloud platforms tell the app which port to use in PORT
server.port=${PORT:8080}

# Running behind the cloud's HTTPS proxy
server.forward-headers-strategy=framework

# Compress JSON/HTML responses for faster loading on the phone
server.compression.enabled=true

# Photo uploads (stored in the MySQL "media" table)
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Old local uploads folder (only read once to move photos into MySQL)
app.upload-dir=uploads
