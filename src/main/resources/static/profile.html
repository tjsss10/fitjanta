<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Profile · FitJanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/fitjanta.css" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitJanta">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0D12">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="app-shell">

    <header class="app-topbar">
        <h1 class="title flex-grow-1">Profile</h1>
        <a href="qr.html" class="icon-btn" aria-label="Share app QR"><i class="bi bi-qr-code"></i></a>
        <div class="dropdown">
            <button class="icon-btn" data-bs-toggle="dropdown" aria-label="Menu"><i class="bi bi-gear"></i></button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil me-2"></i>Edit profile</button></li>
                <li><label class="dropdown-item" for="avatarInput" style="cursor:pointer"><i class="bi bi-camera me-2"></i>Change photo</label></li>
                <li><button class="dropdown-item" id="removePhoto"><i class="bi bi-person-x me-2"></i>Remove photo</button></li>
                <li><a class="dropdown-item" href="map.html"><i class="bi bi-map me-2"></i>Live map</a></li>
                <li><a class="dropdown-item" href="challenges.html"><i class="bi bi-flag me-2"></i>Challenges</a></li>
                <li><a class="dropdown-item" href="leaderboard.html"><i class="bi bi-trophy me-2"></i>Leaderboard</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Log out</button></li>
            </ul>
        </div>
    </header>

    <!-- Identity -->
    <section class="text-center reveal d1">
        <label class="avatar-edit mb-3" id="avatarEdit" for="avatarInput" title="Change profile photo">
            <span id="bigAvatar"></span>
            <span class="cam"><i class="bi bi-camera-fill"></i></span>
        </label>
        <input type="file" id="avatarInput" accept="image/*" class="d-none">
        <div class="mb-2"><span class="badge rounded-pill tint-amber px-3 py-2 d-none" id="rankBadge"></span></div>
        <h2 class="fw-800 mb-0" id="pName">&nbsp;</h2>
        <div class="text-muted small" id="pMeta"></div>
        <p class="mt-2 mb-0 px-3" id="pBio"></p>
        <button class="btn btn-ghost btn-sm mt-3 px-4" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil me-1"></i>Edit profile</button>
    </section>

    <!-- Stats -->
    <section class="fj-card mt-4 reveal d2">
        <div class="row text-center g-0">
            <div class="col"><div class="fs-4 fw-800 text-grad" id="sLevel">1</div><div class="small text-muted">Level</div></div>
            <div class="col border-start" style="border-color:var(--fj-border)!important"><div class="fs-4 fw-800" id="sXp">0</div><div class="small text-muted">XP</div></div>
            <div class="col border-start" style="border-color:var(--fj-border)!important"><div class="fs-4 fw-800"><i class="bi bi-fire text-orange"></i><span id="sStreak">0</span></div><div class="small text-muted">Streak</div></div>
            <div class="col border-start" style="border-color:var(--fj-border)!important"><div class="fs-4 fw-800" id="sPosts">0</div><div class="small text-muted">Posts</div></div>
        </div>
        <div class="mt-3">
            <div class="d-flex justify-content-between small fw-semibold mb-1"><span>Progress to level <span id="nextLvl">2</span></span><span class="text-muted"><span id="xpInto">0</span>/100 XP</span></div>
            <div class="progress"><div class="progress-bar bar-grad" id="xpBar" style="width:0%"></div></div>
        </div>
        <div class="d-flex justify-content-between small mt-3 pt-3 border-top" style="border-color:var(--fj-border)!important">
            <span class="text-muted"><i class="bi bi-bullseye me-1"></i>Daily goal <span class="text-white fw-bold" id="sGoal">2,000</span> kcal</span>
            <span class="text-muted"><i class="bi bi-heart-pulse me-1"></i><span class="text-white fw-bold" id="sWorkouts">0</span> workouts</span>
        </div>
    </section>

    <!-- Tabs -->
    <ul class="nav nav-pills nav-fill mt-4 p-1 rounded-4 reveal d3" style="background:var(--fj-surface)" role="tablist">
        <li class="nav-item"><button class="nav-link active rounded-4 fw-bold" data-bs-toggle="pill" data-bs-target="#tabPosts"><i class="bi bi-grid-3x3-gap me-1"></i>Posts</button></li>
        <li class="nav-item"><button class="nav-link rounded-4 fw-bold" data-bs-toggle="pill" data-bs-target="#tabWorkouts"><i class="bi bi-activity me-1"></i>Workouts</button></li>
    </ul>
    <div class="tab-content mt-3 reveal d4">
        <div class="tab-pane fade show active" id="tabPosts"><div id="postGrid"><div class="skeleton" style="height:120px"></div></div></div>
        <div class="tab-pane fade" id="tabWorkouts"><div id="workoutList"></div></div>
    </div>
</main>

<!-- Edit profile modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content" style="background:var(--fj-bg-2);border:1px solid var(--fj-border-strong);border-radius:24px">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-800">Edit profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" class="modal-body pt-0">
                <div class="form-floating mb-3">
                    <input class="form-control" id="eName" placeholder="Name" required maxlength="60">
                    <label for="eName">Name</label>
                </div>
                <div class="form-floating mb-3">
                    <textarea class="form-control" id="eBio" placeholder="Bio" maxlength="300" style="height:100px"></textarea>
                    <label for="eBio">Bio</label>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6"><div class="form-floating"><input class="form-control" id="eCity" placeholder="City"><label for="eCity">City</label></div></div>
                    <div class="col-6"><div class="form-floating"><input class="form-control" id="ePhone" placeholder="Phone" inputmode="tel"><label for="ePhone">Phone</label></div></div>
                </div>
                <label class="small-caps d-flex justify-content-between mb-2" for="eGoal">Daily calorie goal <span class="text-white" id="eGoalVal">2000 kcal</span></label>
                <input type="range" class="form-range" id="eGoal" min="1200" max="4000" step="50">
                <button class="btn btn-grad w-100 py-3 mt-4" id="saveProfile" type="submit"><i class="bi bi-check2 me-1"></i>Save changes</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/fitjanta.js"></script>
<script>
    let me = FJ.requireUser();
    FJ.nav("profile");
    const $ = id => document.getElementById(id);

    function renderUser(u, s) {
        $("bigAvatar").innerHTML = FJ.avatarOf(u, 104, true);
        $("removePhoto").parentElement.classList.toggle("d-none", !u.avatarUrl);
        $("pName").textContent = u.name;
        $("pMeta").innerHTML = [u.city ? `<i class="bi bi-geo-alt"></i> ${FJ.esc(u.city)}` : "", FJ.esc(u.email)].filter(Boolean).join(" · ");
        $("pBio").textContent = u.bio || "Add a bio so the crew knows what you're training for 💪";
        $("pBio").classList.toggle("text-muted", !u.bio);
        if (s) {
            $("sLevel").textContent = s.level;
            FJ.countUp($("sXp"), s.xp);
            $("sStreak").textContent = s.streak;
            $("sPosts").textContent = s.postsCount;
            $("nextLvl").textContent = s.level + 1;
            $("xpInto").textContent = s.xpIntoLevel;
            setTimeout(() => $("xpBar").style.width = s.xpIntoLevel + "%", 120);
            $("sGoal").textContent = FJ.fmt(s.calorieGoal);
            $("sWorkouts").textContent = s.totalWorkouts;
            const medal = s.rank === 1 ? "🥇" : s.rank === 2 ? "🥈" : s.rank === 3 ? "🥉" : "#" + s.rank;
            $("rankBadge").innerHTML = `<i class="bi bi-trophy-fill me-1"></i>Rank ${medal} on FitJanta`;
            $("rankBadge").classList.remove("d-none");
        }
    }

    // ---------------- Profile photo ----------------
    $("avatarInput").addEventListener("change", async () => {
        const file = $("avatarInput").files[0];
        if (!file) return;
        const wrap = $("avatarEdit");
        wrap.classList.add("uploading");
        try {
            const blob = await FJ.compressImage(file, 640, 0.88);
            const form = new FormData();
            form.append("image", blob, "avatar.jpg");
            me = await FJ.api(`/api/users/${me.id}/avatar`, { method: "POST", form });
            FJ.setUser(me);
            renderUser(me);
            FJ.toast("Profile photo updated", "success");
        } catch (e) {
            FJ.toast(e.message, "error");
        } finally {
            wrap.classList.remove("uploading");
            $("avatarInput").value = "";
        }
    });

    $("removePhoto").addEventListener("click", async () => {
        if (!confirm("Remove your profile photo?")) return;
        try {
            me = await FJ.api(`/api/users/${me.id}/avatar`, { method: "DELETE" });
            FJ.setUser(me);
            renderUser(me);
            FJ.toast("Photo removed", "success");
        } catch (e) { FJ.toast(e.message, "error"); }
    });

    async function load() {
        renderUser(me);
        try {
            const s = await FJ.api(`/api/users/${me.id}/summary`);
            me = s.user;
            FJ.setUser(me);
            renderUser(me, s);
        } catch (e) { FJ.toast(e.message, "error"); }

        try {
            const posts = await FJ.api(`/api/posts/user/${me.id}`);
            $("postGrid").innerHTML = posts.length
                ? `<div class="post-grid">${posts.map(p => `<a href="feed.html#post-${p.id}"><img src="${FJ.esc(p.imageUrl)}" alt="" loading="lazy"></a>`).join("")}</div>`
                : `<div class="fj-card flat empty-state"><i class="bi bi-camera"></i><div class="fw-bold text-white">No posts yet</div>
                   <a href="new-post.html" class="btn btn-grad btn-sm mt-3 px-3">Share your first photo</a></div>`;
        } catch (e) { /* ignore */ }

        try {
            const acts = await FJ.api(`/api/activities/user/${me.id}`);
            $("workoutList").innerHTML = acts.length ? acts.slice(0, 30).map(a => {
                const m = FJ.activityMeta(a.type);
                return `<div class="list-tile"><span class="lt-icon ${m.tint}"><i class="bi ${m.icon}"></i></span>
                    <span class="lt-body"><span class="lt-title d-block">${FJ.esc(a.type)}</span>
                    <span class="lt-sub">${a.distance ? a.distance + " km · " : ""}${a.duration} min${a.date ? " · " + FJ.esc(a.date) : ""}</span></span>
                    <span class="lt-end">${FJ.fmt(a.calories)}<span class="d-block small text-muted fw-semibold">kcal</span></span></div>`;
            }).join("") : `<div class="fj-card flat empty-state"><i class="bi bi-activity"></i><div class="fw-bold text-white">No workouts yet</div>
                   <a href="activity.html" class="btn btn-grad btn-sm mt-3 px-3">Log a workout</a></div>`;
        } catch (e) { /* ignore */ }
    }

    // Edit modal
    $("editModal").addEventListener("show.bs.modal", () => {
        $("eName").value = me.name || "";
        $("eBio").value = me.bio || "";
        $("eCity").value = me.city || "";
        $("ePhone").value = me.phone || "";
        $("eGoal").value = me.calorieGoal || 2000;
        $("eGoalVal").textContent = $("eGoal").value + " kcal";
    });
    $("eGoal").addEventListener("input", () => $("eGoalVal").textContent = $("eGoal").value + " kcal");

    $("editForm").addEventListener("submit", async e => {
        e.preventDefault();
        const btn = $("saveProfile");
        FJ.setLoading(btn, true, "Saving");
        try {
            me = await FJ.api(`/api/users/${me.id}`, {
                method: "PUT",
                body: { name: $("eName").value, bio: $("eBio").value, city: $("eCity").value, phone: $("ePhone").value, calorieGoal: Number($("eGoal").value) }
            });
            FJ.setUser(me);
            bootstrap.Modal.getInstance($("editModal")).hide();
            FJ.toast("Profile updated", "success");
            load();
        } catch (err) {
            FJ.toast(err.message, "error");
        } finally {
            FJ.setLoading(btn, false);
        }
    });

    $("logoutBtn").addEventListener("click", () => {
        if (confirm("Log out of FitJanta?")) FJ.logout();
    });

    load();
</script>
</body>
</html>
