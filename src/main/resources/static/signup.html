<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create account · FitJanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/fitjanta.css" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitJanta">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0D12">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="app-shell no-nav">
    <span class="hero-orb o1"></span>

    <header class="d-flex align-items-center justify-content-between mb-4 reveal">
        <a href="index.html" class="icon-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
        <span class="small text-muted fw-semibold">Step <span id="stepNo">1</span> of 2</span>
        <span style="width:42px"></span>
    </header>

    <div class="progress mb-4" style="height:6px"><div class="progress-bar bar-grad" id="stepBar" style="width:50%"></div></div>

    <form id="signupForm" novalidate>

        <!-- STEP 1: account -->
        <section id="step1">
            <p class="small-caps text-orange mb-2 reveal d1">Start your journey</p>
            <h1 class="fw-800 mb-1 reveal d2" style="font-size:2rem;letter-spacing:-.03em">Create your account</h1>
            <p class="text-muted mb-4 reveal d2">It takes less than a minute.</p>

            <div class="reveal d3">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="name" placeholder="Full name" autocomplete="name" required>
                    <label for="name"><i class="bi bi-person me-2"></i>Full name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" autocomplete="email" required>
                    <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" class="form-control" id="phone" placeholder="Phone" autocomplete="tel" inputmode="tel">
                    <label for="phone"><i class="bi bi-phone me-2"></i>Phone</label>
                </div>
                <div class="form-floating mb-2 input-icon">
                    <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="new-password" minlength="6" required>
                    <label for="password"><i class="bi bi-lock me-2"></i>Password (min 6 characters)</label>
                    <i class="bi bi-eye" id="togglePassword" role="button" aria-label="Show password"></i>
                </div>
                <div class="progress mt-2" style="height:4px"><div class="progress-bar" id="pwdBar" style="width:0%"></div></div>
                <div class="small text-muted mt-1" id="pwdText">&nbsp;</div>
            </div>

            <button type="button" id="nextBtn" class="btn btn-grad w-100 py-3 mt-4 reveal d4">
                Continue <i class="bi bi-arrow-right-short fs-5 align-middle"></i>
            </button>
        </section>

        <!-- STEP 2: location & goal -->
        <section id="step2" class="d-none">
            <p class="small-caps text-orange mb-2">Almost there</p>
            <h1 class="fw-800 mb-1" style="font-size:2rem;letter-spacing:-.03em">Personalise FitJanta</h1>
            <p class="text-muted mb-4">This helps us set your daily calorie target.</p>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="address" placeholder="Address" autocomplete="street-address">
                <label for="address"><i class="bi bi-house me-2"></i>Address</label>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-7">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="city" placeholder="City" autocomplete="address-level2">
                        <label for="city">City</label>
                    </div>
                </div>
                <div class="col-5">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="pincode" placeholder="Pincode" inputmode="numeric" autocomplete="postal-code">
                        <label for="pincode">Pincode</label>
                    </div>
                </div>
            </div>
            <div class="form-floating mb-4">
                <input type="text" class="form-control" id="country" placeholder="Country" value="India" autocomplete="country-name">
                <label for="country"><i class="bi bi-globe2 me-2"></i>Country</label>
            </div>

            <label class="small-caps mb-2 d-block">Your goal</label>
            <div class="chip-group mb-2" id="goalChips">
                <input type="radio" class="btn-check" name="goal" id="g1" value="1700">
                <label class="chip" for="g1"><i class="bi bi-graph-down-arrow"></i> Lose weight</label>
                <input type="radio" class="btn-check" name="goal" id="g2" value="2000" checked>
                <label class="chip" for="g2"><i class="bi bi-heart-pulse"></i> Stay fit</label>
                <input type="radio" class="btn-check" name="goal" id="g3" value="2500">
                <label class="chip" for="g3"><i class="bi bi-lightning-charge"></i> Build muscle</label>
            </div>
            <p class="small text-muted">Daily target: <span class="fw-bold text-white" id="goalText">2,000</span> kcal (you can change it later)</p>

            <div id="signupError" class="alert alert-danger py-2 small d-none"></div>

            <div class="d-flex gap-2 mt-4">
                <button type="button" id="backBtn" class="btn btn-ghost py-3 px-4"><i class="bi bi-arrow-left"></i></button>
                <button type="submit" id="signupBtn" class="btn btn-grad flex-grow-1 py-3">
                    Create account <i class="bi bi-check2-circle ms-1"></i>
                </button>
            </div>
        </section>
    </form>

    <p class="text-center text-muted mt-4">
        Already a member? <a href="login.html" class="fw-bold text-decoration-none">Log in</a>
    </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/fitjanta.js"></script>
<script>
    if (FJ.user() && FJ.user().id) window.location.replace("home.html");

    const $ = id => document.getElementById(id);
    const pwd = $("password");

    $("togglePassword").addEventListener("click", e => {
        const show = pwd.type === "password";
        pwd.type = show ? "text" : "password";
        e.target.className = "bi " + (show ? "bi-eye-slash" : "bi-eye");
    });

    // Live password strength meter
    pwd.addEventListener("input", () => {
        const v = pwd.value;
        let score = 0;
        if (v.length >= 6) score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const levels = [["0%", "", "&nbsp;"], ["25%", "bg-danger", "Weak"], ["45%", "bg-warning", "Okay"], ["65%", "bar-amber", "Good"], ["85%", "bar-lime", "Strong"], ["100%", "bar-lime", "Very strong"]];
        const [w, cls, label] = levels[v ? Math.max(1, score) : 0];
        $("pwdBar").style.width = w;
        $("pwdBar").className = "progress-bar " + cls;
        $("pwdText").innerHTML = label;
    });

    document.querySelectorAll('input[name="goal"]').forEach(r =>
        r.addEventListener("change", () => $("goalText").textContent = FJ.fmt(r.value)));

    function showStep(n) {
        $("step1").classList.toggle("d-none", n !== 1);
        $("step2").classList.toggle("d-none", n !== 2);
        $("stepNo").textContent = n;
        $("stepBar").style.width = n === 1 ? "50%" : "100%";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("nextBtn").addEventListener("click", () => {
        const fields = ["name", "email", "password"];
        let ok = true;
        fields.forEach(id => {
            const el = $(id);
            const valid = el.value.trim() && el.checkValidity();
            el.classList.toggle("is-invalid", !valid);
            ok = ok && valid;
        });
        if (!ok) {
            FJ.toast("Please fill in your name, a valid email and a 6+ character password.", "error");
            return;
        }
        showStep(2);
    });
    $("backBtn").addEventListener("click", () => showStep(1));

    $("signupForm").addEventListener("submit", async event => {
        event.preventDefault();
        const btn = $("signupBtn");
        $("signupError").classList.add("d-none");

        const user = {
            name: $("name").value.trim(),
            email: $("email").value.trim(),
            phone: $("phone").value.trim(),
            password: pwd.value,
            address: $("address").value.trim(),
            city: $("city").value.trim(),
            pincode: $("pincode").value.trim(),
            country: $("country").value.trim(),
            calorieGoal: Number(document.querySelector('input[name="goal"]:checked').value)
        };

        FJ.setLoading(btn, true, "Creating account");
        try {
            const saved = await FJ.api("/api/users/register", { method: "POST", body: user });
            FJ.setUser(saved);
            FJ.celebrate("Welcome!", "Your FitJanta journey starts now");
            setTimeout(() => window.location.href = "home.html", 1400);
        } catch (e) {
            $("signupError").textContent = e.message;
            $("signupError").classList.remove("d-none");
            FJ.setLoading(btn, false);
        }
    });
</script>
</body>
</html>
