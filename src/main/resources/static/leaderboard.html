<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Leaderboard · FitJanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/fitjanta.css" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitJanta">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0D12">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="app-shell">

    <header class="app-topbar">
        <a href="home.html" class="icon-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
        <h1 class="title flex-grow-1">Leaderboard</h1>
        <a href="challenges.html" class="icon-btn" aria-label="Challenges"><i class="bi bi-flag"></i></a>
    </header>

    <p class="text-muted small mb-0 reveal d1">Ranked by total XP. Earn XP from workouts and challenges.</p>

    <section class="podium reveal d2" id="podium"></section>

    <section class="fj-card tight d-flex align-items-center gap-3 mb-3 reveal d3" id="myRank" style="border-color:rgba(255,90,60,.5)"></section>

    <section id="list" class="reveal d4"><div class="skeleton" style="height:70px"></div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/fitjanta.js"></script>
<script>
    const me = FJ.requireUser();
    FJ.nav("");
    const $ = id => document.getElementById(id);

    function podiumCol(u, place) {
        if (!u) return `<div class="p-col p${place}"></div>`;
        return `<a href="${FJ.profileHref(u.id)}" class="p-col p${place} text-decoration-none text-white">
            ${place === 1 ? '<i class="bi bi-trophy-fill crown"></i>' : ""}
            ${FJ.avatarOf(u, place === 1 ? 64 : 52, true)}
            <div class="fw-bold small mt-2 text-truncate">${FJ.esc(u.name.split(" ")[0])}</div>
            <div class="p-block"><div class="fs-4">${place}</div><div class="small fw-semibold" style="opacity:.85">${FJ.fmt(u.xp)} XP</div></div>
        </a>`;
    }

    async function load() {
        try {
            const users = await FJ.api("/api/leaderboard");
            $("podium").innerHTML = podiumCol(users[1], 2) + podiumCol(users[0], 1) + podiumCol(users[2], 3);

            const myIndex = users.findIndex(u => u.id === me.id);
            if (myIndex >= 0) {
                const u = users[myIndex];
                const ahead = myIndex > 0 ? users[myIndex - 1].xp - u.xp : 0;
                $("myRank").innerHTML = `<div class="fs-3 fw-800 text-grad" style="width:48px;text-align:center">#${myIndex + 1}</div>
                    ${FJ.avatarOf(u, 44)}
                    <div class="flex-grow-1"><div class="fw-800">You</div>
                    <div class="small text-muted">${myIndex === 0 ? "You're leading! 👑" : `${FJ.fmt(ahead + 1)} XP to pass ${FJ.esc(users[myIndex - 1].name.split(" ")[0])}`}</div></div>
                    <div class="text-end fw-800">${FJ.fmt(u.xp)}<div class="small text-muted fw-semibold">XP</div></div>`;
            } else {
                $("myRank").classList.add("d-none");
            }

            $("list").innerHTML = users.map((u, i) => `
                <a href="${FJ.profileHref(u.id)}" class="list-tile pressable ${u.id === me.id ? "border-primary" : ""}">
                    <div class="fw-800 text-muted" style="width:28px;text-align:center">${i + 1}</div>
                    ${FJ.avatarOf(u, 42)}
                    <span class="lt-body"><span class="lt-title d-block">${FJ.esc(u.name)}${u.id === me.id ? ' <span class="badge rounded-pill tint-orange">You</span>' : ""}</span>
                    <span class="lt-sub">Level ${Math.max(1, u.level)} · <i class="bi bi-fire text-orange"></i> ${u.streak} · ${u.workoutsCount} workouts${u.territoriesCount ? ` · <i class="bi bi-flag-fill text-cyan"></i> ${u.territoriesCount}` : ""}</span></span>
                    <span class="lt-end">${FJ.fmt(u.xp)}<span class="d-block small text-muted fw-semibold">XP</span></span>
                </a>`).join("");
        } catch (e) { FJ.toast(e.message, "error"); }
    }

    load();
</script>
</body>
</html>
