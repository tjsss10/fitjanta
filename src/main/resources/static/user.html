<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Athlete · FitJanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/fitjanta.css" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitJanta">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0D12">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="app-shell">

    <header class="app-topbar">
        <button class="icon-btn" onclick="history.length > 1 ? history.back() : location.href='feed.html'" aria-label="Back"><i class="bi bi-chevron-left"></i></button>
        <h1 class="title flex-grow-1 text-truncate" id="topName">Athlete</h1>
        <a href="map.html" class="icon-btn" aria-label="Map"><i class="bi bi-map"></i></a>
    </header>

    <div id="content">
        <div class="text-center py-4"><div class="skeleton d-inline-block" style="width:110px;height:110px;border-radius:50%"></div></div>
        <div class="skeleton" style="height:140px"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/fitjanta.js"></script>
<script>
    const me = FJ.requireUser();
    FJ.nav("");
    const $ = id => document.getElementById(id);
    const id = Number(new URLSearchParams(location.search).get("id"));

    if (!id) location.replace("feed.html");
    if (id === me.id) location.replace("profile.html");

    function medal(rank) {
        return rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : "#" + rank;
    }

    async function load() {
        try {
            const [p, posts] = await Promise.all([
                FJ.api(`/api/users/${id}/public`),
                FJ.api(`/api/posts/user/${id}`)
            ]);
            document.title = p.name + " · FitJanta";
            $("topName").textContent = p.name;

            const joined = p.joinedAt ? new Date(p.joinedAt).toLocaleDateString(undefined, { month: "short", year: "numeric" }) : null;
            const fav = p.favouriteActivity ? FJ.activityMeta(p.favouriteActivity) : null;

            $("content").innerHTML = `
            <section class="text-center reveal d1">
                <div class="d-inline-block mb-3">${FJ.avatarOf(p, 110, true)}</div>
                <h2 class="fw-800 mb-0">${FJ.esc(p.name)}</h2>
                <div class="text-muted small">${p.city ? `<i class="bi bi-geo-alt"></i> ${FJ.esc(p.city)}` : ""}${joined ? ` · Joined ${joined}` : ""}</div>
                ${p.bio ? `<p class="mt-2 mb-0 px-3">${FJ.esc(p.bio)}</p>` : ""}
                <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
                    <span class="badge rounded-pill tint-amber px-3 py-2"><i class="bi bi-trophy-fill me-1"></i>Rank ${medal(p.rank)}</span>
                    ${fav ? `<span class="badge rounded-pill ${fav.tint} px-3 py-2"><i class="bi ${fav.icon} me-1"></i>Loves ${FJ.esc(p.favouriteActivity)}</span>` : ""}
                </div>
            </section>

            <section class="fj-card fj-card-grad mt-4 reveal d2">
                <div class="row text-center g-0">
                    <div class="col"><div class="fs-3 fw-800">${p.level}</div><div class="small fw-semibold" style="opacity:.85">Level</div></div>
                    <div class="col"><div class="fs-3 fw-800">${FJ.fmt(p.xp)}</div><div class="small fw-semibold" style="opacity:.85">XP</div></div>
                    <div class="col"><div class="fs-3 fw-800"><i class="bi bi-fire"></i>${p.streak}</div><div class="small fw-semibold" style="opacity:.85">Streak</div></div>
                </div>
                <div class="d-flex justify-content-between small fw-semibold mt-3 mb-1" style="opacity:.9"><span>Progress to level ${p.level + 1}</span><span>${p.xpIntoLevel}/100 XP</span></div>
                <div class="progress" style="background:rgba(0,0,0,.25)"><div class="progress-bar" id="xpBar" style="width:0%;background:#fff"></div></div>
            </section>

            <section class="stat-grid mt-3 reveal d3">
                <div class="stat-tile"><span class="stat-icon tint-pink"><i class="bi bi-heart-pulse-fill"></i></span>
                    <div class="stat-value">${FJ.fmt(p.workoutsCount)}</div><div class="stat-label">Workouts</div></div>
                <div class="stat-tile"><span class="stat-icon tint-lime"><i class="bi bi-signpost-split-fill"></i></span>
                    <div class="stat-value">${p.totalDistanceKm}<small class="fs-6 text-muted"> km</small></div><div class="stat-label">Total distance</div></div>
                <div class="stat-tile"><span class="stat-icon tint-orange"><i class="bi bi-fire"></i></span>
                    <div class="stat-value">${FJ.fmt(p.totalCaloriesBurned)}</div><div class="stat-label">Calories burned</div></div>
                <div class="stat-tile"><span class="stat-icon tint-cyan"><i class="bi bi-flag-fill"></i></span>
                    <div class="stat-value">${p.territoriesCount}</div><div class="stat-label">Territories</div></div>
            </section>

            <div class="section-title"><h2>Posts <span class="text-muted fw-semibold">${p.postsCount}</span></h2></div>
            <section class="reveal d4">${posts.length
                ? `<div class="post-grid">${posts.map(x => `<a href="feed.html#post-${x.id}"><img src="${FJ.esc(x.imageUrl)}" alt="" loading="lazy"></a>`).join("")}</div>`
                : `<div class="fj-card flat empty-state"><i class="bi bi-camera"></i><div class="fw-bold text-white">No posts yet</div></div>`}
            </section>`;

            setTimeout(() => { const b = $("xpBar"); if (b) b.style.width = p.xpIntoLevel + "%"; }, 150);
        } catch (e) {
            $("content").innerHTML = `<div class="fj-card empty-state"><i class="bi bi-person-x"></i><div class="fw-bold text-white">${FJ.esc(e.message)}</div></div>`;
        }
    }

    load();
</script>
</body>
</html>
