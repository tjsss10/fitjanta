<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Log in · FitJanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/fitjanta.css" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitJanta">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0D12">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="auth-hero">
    <span class="hero-orb o1"></span>
    <span class="hero-orb o2"></span>

    <header class="d-flex align-items-center justify-content-between reveal">
        <a href="index.html" class="icon-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
        <img src="img/logo-mark.svg" alt="FitJanta" width="40" height="40" style="border-radius:12px">
        <span style="width:42px"></span>
    </header>

    <section class="my-4">
        <p class="small-caps text-orange mb-2 reveal d1">Welcome back</p>
        <h1 class="display-hero mb-2 reveal d2" style="font-size:2.4rem">Log in to keep<br><span class="text-grad">your streak alive.</span></h1>
        <p class="text-muted reveal d3">Your XP, meals and posts are waiting for you.</p>

        <form id="loginForm" class="mt-4 reveal d4" novalidate>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email" required>
                <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
            </div>
            <div class="form-floating mb-2 input-icon">
                <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required>
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                <i class="bi bi-eye" id="togglePassword" role="button" aria-label="Show password"></i>
            </div>

            <div id="loginError" class="alert alert-danger py-2 small d-none mt-3 mb-0"></div>

            <button type="submit" id="loginBtn" class="btn btn-grad w-100 py-3 mt-4">
                Log in <i class="bi bi-arrow-right-short fs-5 align-middle"></i>
            </button>
        </form>
    </section>

    <p class="text-center text-muted mb-0 reveal d5">
        New to FitJanta? <a href="signup.html" class="fw-bold text-decoration-none">Create an account</a>
    </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/fitjanta.js"></script>
<script>
    if (FJ.user() && FJ.user().id) window.location.replace("home.html");

    const pwd = document.getElementById("password");
    document.getElementById("togglePassword").addEventListener("click", e => {
        const show = pwd.type === "password";
        pwd.type = show ? "text" : "password";
        e.target.className = "bi " + (show ? "bi-eye-slash" : "bi-eye");
    });

    document.getElementById("loginForm").addEventListener("submit", async event => {
        event.preventDefault();
        const btn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("loginError");
        errorBox.classList.add("d-none");

        const email = document.getElementById("email").value.trim();
        const password = pwd.value;
        if (!email || !password) {
            errorBox.textContent = "Enter your email and password.";
            errorBox.classList.remove("d-none");
            return;
        }

        FJ.setLoading(btn, true, "Logging in");
        try {
            const user = await FJ.api("/api/users/login", { method: "POST", body: { email, password } });
            FJ.setUser(user);
            FJ.haptic();
            window.location.href = "home.html";
        } catch (e) {
            errorBox.textContent = e.message;
            errorBox.classList.remove("d-none");
            FJ.setLoading(btn, false);
        }
    });
</script>
</body>
</html>
