<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Log workout · FitJanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/fitjanta.css" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitJanta">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0D12">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .type-card {
            background: var(--fj-surface); border: 1px solid var(--fj-border); border-radius: 20px;
            padding: 14px 8px; text-align: center; cursor: pointer; transition: all .18s ease;
        }
        .type-card .bi { font-size: 1.6rem; display: block; margin-bottom: 4px; }
        .type-card span { font-size: .8rem; font-weight: 700; }
        .btn-check:checked + .type-card { background: var(--fj-grad); border-color: transparent; box-shadow: var(--fj-glow); color: #fff; transform: translateY(-2px); }
        .btn-check:checked + .type-card .bi { color: #fff !important; }
        .stepper { display: flex; align-items: center; gap: 12px; }
        .stepper button { width: 48px; height: 48px; border-radius: 16px; font-size: 1.4rem; padding: 0; }
        .stepper .val { flex: 1; text-align: center; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
        .stepper .val small { font-size: .9rem; color: var(--fj-muted); font-weight: 600; }
    </style>
</head>
<body>

<main class="app-shell">

    <header class="app-topbar">
        <a href="home.html" class="icon-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
        <h1 class="title flex-grow-1">Log workout</h1>
        <a href="challenges.html" class="icon-btn" aria-label="Challenges"><i class="bi bi-flag"></i></a>
    </header>

    <div class="small-caps mb-2 reveal d1">Choose activity</div>
    <section class="type-grid reveal d1" id="types"></section>

    <section class="fj-card mt-3 reveal d2" id="distanceCard">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="small-caps">Distance</div>
            <div class="chip-group" id="distPresets"></div>
        </div>
        <div class="stepper">
            <button class="btn btn-ghost" data-step="distance" data-delta="-0.5"><i class="bi bi-dash"></i></button>
            <div class="val"><span id="distanceVal">3.0</span> <small>km</small></div>
            <button class="btn btn-ghost" data-step="distance" data-delta="0.5"><i class="bi bi-plus"></i></button>
        </div>
        <input type="range" class="form-range mt-2" id="distanceRange" min="0" max="42" step="0.5" value="3">
    </section>

    <section class="fj-card mt-3 reveal d3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="small-caps">Duration</div>
            <div class="chip-group" id="timePresets"></div>
        </div>
        <div class="stepper">
            <button class="btn btn-ghost" data-step="duration" data-delta="-5"><i class="bi bi-dash"></i></button>
            <div class="val"><span id="durationVal">30</span> <small>min</small></div>
            <button class="btn btn-ghost" data-step="duration" data-delta="5"><i class="bi bi-plus"></i></button>
        </div>
        <input type="range" class="form-range mt-2" id="durationRange" min="0" max="240" step="5" value="30">
    </section>

    <!-- Live preview -->
    <section class="fj-card fj-card-grad mt-3 reveal d4">
        <div class="row text-center g-0">
            <div class="col">
                <div class="small fw-semibold" style="opacity:.85">Calories burned</div>
                <div class="display-6 fw-800 lh-1 mt-1" id="kcalPreview">0</div>
            </div>
            <div class="col border-start" style="border-color:rgba(255,255,255,.25)!important">
                <div class="small fw-semibold" style="opacity:.85">XP you'll earn</div>
                <div class="display-6 fw-800 lh-1 mt-1">+<span id="xpPreview">0</span></div>
            </div>
        </div>
        <div class="small text-center mt-3" style="opacity:.85" id="paceText">&nbsp;</div>
    </section>

    <button class="btn btn-lime w-100 py-3 mt-3 fs-6" id="saveBtn"><i class="bi bi-check2-circle me-1"></i> Save workout</button>

    <div class="section-title"><h2>Recent workouts</h2><span class="small text-muted" id="histCount"></span></div>
    <section id="history"><div class="skeleton" style="height:70px"></div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/fitjanta.js"></script>
<script>
    const me = FJ.requireUser();
    FJ.nav("");
    const $ = id => document.getElementById(id);

    // Same formulas as the server (ActivityController) for a live preview
    const TYPES = {
        Walking:  { icon: "bi-person-walking", color: "text-lime", usesDistance: true, kcal: (d, m) => d > 0 ? d * 55 : m * 4.5, xp: (d, m) => d * 10 },
        Running:  { icon: "bi-lightning-charge-fill", color: "text-orange", usesDistance: true, kcal: (d, m) => d > 0 ? d * 68 : m * 11, xp: (d, m) => d * 15 },
        Cycling:  { icon: "bi-bicycle", color: "text-cyan", usesDistance: true, kcal: (d, m) => d > 0 ? d * 30 : m * 7.5, xp: (d, m) => d * 8 },
        Swimming: { icon: "bi-water", color: "text-cyan", usesDistance: false, kcal: (d, m) => m * 9, xp: (d, m) => m * 2 },
        Workout:  { icon: "bi-heart-pulse-fill", color: "text-pink", usesDistance: false, kcal: (d, m) => m * 7, xp: (d, m) => m * 2 },
        Yoga:     { icon: "bi-flower1", color: "text-violet", usesDistance: false, kcal: (d, m) => m * 3.5, xp: (d, m) => m * 1.5 }
    };

    $("types").innerHTML = Object.entries(TYPES).map(([name, t], i) => `
        <input type="radio" class="btn-check" name="type" id="t${name}" value="${name}" ${i === 1 ? "checked" : ""}>
        <label class="type-card" for="t${name}"><i class="bi ${t.icon} ${t.color}"></i><span>${name}</span></label>`).join("");

    $("distPresets").innerHTML = [1, 3, 5, 10].map(v => `<button class="chip py-1 px-2" data-preset="distance" data-v="${v}">${v}k</button>`).join("");
    $("timePresets").innerHTML = [15, 30, 45, 60].map(v => `<button class="chip py-1 px-2" data-preset="duration" data-v="${v}">${v}m</button>`).join("");

    const state = { distance: 3, duration: 30 };
    const type = () => document.querySelector('input[name="type"]:checked').value;

    function render() {
        const t = TYPES[type()];
        $("distanceCard").classList.toggle("opacity-50", !t.usesDistance);
        $("distanceCard").style.pointerEvents = t.usesDistance ? "" : "none";
        const d = t.usesDistance ? state.distance : 0;
        const m = state.duration;
        $("distanceVal").textContent = state.distance.toFixed(1);
        $("durationVal").textContent = m;
        $("distanceRange").value = state.distance;
        $("durationRange").value = m;
        $("kcalPreview").textContent = FJ.fmt(Math.round(t.kcal(d, m)));
        let xp = Math.floor(t.xp(d, m));
        if (xp === 0) xp = Math.max(10, m);
        $("xpPreview").textContent = xp;
        $("paceText").innerHTML = t.usesDistance && d > 0 && m > 0
            ? `<i class="bi bi-speedometer2 me-1"></i>Pace ${(m / d).toFixed(1)} min/km · ${(d / (m / 60)).toFixed(1)} km/h`
            : `<i class="bi bi-info-circle me-1"></i>${type()} is tracked by time`;
    }

    document.addEventListener("click", e => {
        const s = e.target.closest("[data-step]");
        if (s) {
            const key = s.dataset.step;
            const max = key === "distance" ? 42 : 240;
            state[key] = Math.min(max, Math.max(0, +(state[key] + Number(s.dataset.delta)).toFixed(1)));
            FJ.haptic();
            render();
        }
        const p = e.target.closest("[data-preset]");
        if (p) {
            state[p.dataset.preset] = Number(p.dataset.v);
            FJ.haptic();
            render();
        }
    });
    $("distanceRange").addEventListener("input", e => { state.distance = Number(e.target.value); render(); });
    $("durationRange").addEventListener("input", e => { state.duration = Number(e.target.value); render(); });
    $("types").addEventListener("change", () => { FJ.haptic(); render(); });

    $("saveBtn").addEventListener("click", async () => {
        const t = TYPES[type()];
        const body = {
            userId: me.id,
            type: type(),
            distance: t.usesDistance ? state.distance : 0,
            duration: state.duration
        };
        const btn = $("saveBtn");
        FJ.setLoading(btn, true, "Saving workout");
        try {
            const r = await FJ.api("/api/activities", { method: "POST", body });
            FJ.setUser(r.user);
            FJ.celebrate(`+${r.xpEarned} XP`, r.levelUp ? `Level up! You're now level ${r.user.level} 🚀` : `${body.type} saved · ${FJ.fmt(r.activity.calories)} kcal burned 🔥`);
            loadHistory();
        } catch (e) {
            FJ.toast(e.message, "error");
        } finally {
            FJ.setLoading(btn, false);
        }
    });

    async function loadHistory() {
        try {
            const acts = await FJ.api(`/api/activities/user/${me.id}`);
            $("histCount").textContent = acts.length ? acts.length + " total" : "";
            $("history").innerHTML = acts.length ? acts.slice(0, 15).map(a => {
                const m = FJ.activityMeta(a.type);
                return `<div class="list-tile">
                    <span class="lt-icon ${m.tint}"><i class="bi ${m.icon}"></i></span>
                    <span class="lt-body"><span class="lt-title d-block">${FJ.esc(a.type)}</span>
                    <span class="lt-sub">${a.distance ? a.distance + " km · " : ""}${a.duration} min${a.date ? " · " + FJ.esc(a.date) : ""}</span></span>
                    <span class="lt-end me-1">${FJ.fmt(a.calories)}<span class="d-block small text-muted fw-semibold">kcal</span></span>
                    <button class="btn btn-sm btn-ghost text-pink" data-del="${a.id}" aria-label="Delete"><i class="bi bi-trash3"></i></button>
                </div>`;
            }).join("") : `<div class="fj-card flat empty-state"><i class="bi bi-stopwatch"></i><div class="fw-bold text-white">No workouts yet</div><div class="small">Your first one is a tap away.</div></div>`;
        } catch (e) {
            FJ.toast(e.message, "error");
        }
    }

    $("history").addEventListener("click", async e => {
        const b = e.target.closest("[data-del]");
        if (!b || !confirm("Delete this workout? (XP already earned is kept)")) return;
        try {
            await FJ.api(`/api/activities/${b.dataset.del}?userId=${me.id}`, { method: "DELETE" });
            FJ.toast("Workout deleted", "success");
            loadHistory();
        } catch (err) { FJ.toast(err.message, "error"); }
    });

    render();
    loadHistory();
</script>
</body>
</html>
